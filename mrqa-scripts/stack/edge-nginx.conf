# Approximation of prod's omnigent-web-proxy (static /assets from disk, rest proxied), per memory omnigent-fork-deploy.
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  log_format t '$remote_addr [$time_iso8601] "$request" $status rt=$request_time urt=$upstream_response_time key="$http_x_databricks_omnigent_slice_key" up="$upstream_http_x_omnigent_upstream"';
  access_log /dev/stdout t;
  upstream app { server mrqa-router-1:80; keepalive 32; }
  server {
    listen 80;
    client_max_body_size 200m;
    location /assets/ { root /srv/web-ui; try_files $uri @app; expires 1y; }
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s; proxy_send_timeout 3600s;
      proxy_hide_header X-Omnigent-Principal;
    }
    location @app { proxy_pass http://app; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; }
  }
}
