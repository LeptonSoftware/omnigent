# Host-sharded router for N Omnigent server replicas on one box.
#
# Fork-owned. Modeled on upstream
# deploy/kubernetes/multi_replica/ingress.yaml, written as plain NGINX so it
# runs in a stock nginx container next to docker-compose.yaml.
#
# Every client that talks about a host (the host daemon, its runners, the CLI
# and a browser built with VITE_OMNIGENT_HOST_ROUTING=true) sends that host's
# id as the slice key. Hashing the key sends all of them to the same replica,
# which is the one holding the host's live tunnels. Requests without a key
# (session lists, settings, search) carry no host affinity; NGINX's hash
# balancer falls back to round robin for an empty key, and any replica can
# answer them from Postgres.
#
# The replica list lives in upstreams.conf; edit that file, not this one, to
# add a replica (see README.md).

worker_processes auto;
# On `nginx -s reload` (replica added or removed), old workers close their
# open tunnels after 2 s so hosts reconnect and re-hash onto the new set.
# Without it they keep the old routing until each socket ends on its own.
worker_shutdown_timeout 2s;

events {
    worker_connections 4096;
}

http {
    # HTTP clients send the header; browser WebSockets cannot set headers, so
    # they pass ?omnigent_slice_key=<host_id> instead. Header wins.
    map $http_x_databricks_omnigent_slice_key $omnigent_host_key {
        ""      $arg_omnigent_slice_key;
        default $http_x_databricks_omnigent_slice_key;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    log_format omnigent '$remote_addr [$time_iso8601] "$request" $status '
                        'key="$omnigent_host_key" upstream=$upstream_addr '
                        'rt=$request_time';
    access_log /dev/stdout omnigent;
    error_log /dev/stderr warn;

    include /etc/nginx/omnigent/upstreams.conf;

    server {
        listen 80;

        # Bundles can be large (agent uploads, attachments).
        client_max_body_size 200m;

        location / {
            proxy_pass http://omnigent;
            proxy_http_version 1.1;

            # WebSockets: host tunnel, runner tunnel, terminals, session updates.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tunnels and SSE streams stay open for hours; buffering would
            # hold SSE events back.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;

            # A failed request must not retry on another replica: the host's
            # tunnel is still on the first one. Membership changes come from
            # editing upstreams.conf and reloading, never from per-request
            # failover.
            proxy_next_upstream off;

            # Which replica answered, for debugging and the rehearsal check.
            add_header X-Omnigent-Upstream $upstream_addr always;
        }
    }
}
