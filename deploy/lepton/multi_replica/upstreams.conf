# The replicas behind the router. One `server` line per replica service in
# docker-compose.yaml. Consistent hashing places points by server NAME, so
# keep names stable: adding a replica moves only about 1/N of the hosts.
#
# `resolve` + the resolver re-read a replica's address when compose recreates
# its container (a new IP), without restarting NGINX. Needs nginx >= 1.27.3.

resolver 127.0.0.11 valid=5s ipv6=off;

upstream omnigent {
    zone omnigent_upstreams 64k;
    hash $omnigent_host_key consistent;

    server replica-0:8000 resolve max_fails=0;
    server replica-1:8000 resolve max_fails=0;

    keepalive 64;
}
